limit_req_zone $binary_remote_addr zone=contact_zone:10m rate=3r/m;

server {
    server_name kqin517.top www.kqin517.top;

    root /var/www/kqin517.top;
    index index.html;
    client_max_body_size 16k;

    access_log /var/log/nginx/kqin517.top.access.log;
    error_log /var/log/nginx/kqin517.top.error.log;

    location = /api/tickets {
        limit_req zone=contact_zone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /api/admin/ {
        auth_basic "Bob Tickets";
        auth_basic_user_file /etc/nginx/.htpasswd-bob;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "Bob Tickets";
        auth_basic_user_file /etc/nginx/.htpasswd-bob;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. { deny all; }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kqin517.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kqin517.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kqin517.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kqin517.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name kqin517.top www.kqin517.top;
    return 404; # managed by Certbot
}
